<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>내 토끼</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" aria-label="내 토끼 데스크톱 펫">
    <div id="message" role="status" aria-live="polite"></div>
    <div id="hearts" aria-hidden="true"></div>
    <img id="item-house" class="item-layer item-house hidden" src="../assets/item-house.png" alt="토끼 집">
    <img id="item-chair" class="item-layer item-chair hidden" src="../assets/item-chair.png" alt="작은 의자">
    <div id="direction" class="facing-left">
      <button id="pet" type="button" aria-label="토끼 쓰다듬기">
        <img id="bunny" src="../assets/bunny-sleep.png" draggable="false" alt="식빵을 굽고 있는 귀여운 흰색 롭이어 토끼">
      </button>
    </div>
    <img id="item-doll" class="item-layer item-doll hidden" src="../assets/item-doll.png" alt="토끼 인형">
    <img id="item-hay" class="item-layer item-hay hidden" src="../assets/item-hay.png" alt="건초">
    <img id="item-bag" class="item-layer item-bag hidden" src="../assets/item-bag.png" alt="가방">
  </main>
  <script src="state-machine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
